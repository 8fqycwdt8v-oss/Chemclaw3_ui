# Automated dependency updates.
#
# `ci.yml` now *detects* a vulnerable production closure — `npm audit --omit=dev
# --audit-level=high`, blocking. What nothing did was *propose the fix*: a finding turned into a red
# build and then into somebody hand-resolving a bump, and that hand step is what decides how long
# the window between "we know" and "it is fixed" actually is. These two ecosystems are the ones that
# gate a merge here.
#
# Dependabot's *security* updates are also why the audit gate can scope itself to production
# without leaving the dev tree unwatched: an alert on a devDependency still opens a pull request,
# it just does not hold the merge queue for a package no browser ever loads.
version: 2
updates:
  # The actions are SHA-pinned (see `.github/workflows/ci.yml`), which is the reason this entry has
  # to exist: a pinned digest never floats to a fix on its own, so pinning without an updater trades
  # a supply-chain risk for a staleness one. Dependabot rewrites the digest and the `# vX.Y.Z`
  # comment together, so the pin stays readable.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']

  # Grouped into one pull request rather than one per package, deliberately. Every bump here runs
  # the full gate — a production build, a Playwright browser install, a browser suite and a Docker
  # image — and this tree pins no upper bounds outside Ketcher, so an ungrouped week is a dozen of
  # those. Security updates are exempt from the grouping (`applies-to: version-updates`), so a CVE
  # fix is never queued behind an unrelated minor bump.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']

      # The three Ketcher packages are pinned to one exact version in `package.json` and have to
      # move together: `ketcher-react` renders a `ketcher-core` structure and `ketcher-standalone`
      # supplies the Indigo WASM engine under both, so a split version set fails at runtime inside
      # the sketcher rather than at build time. They get their own group so the pull request that
      # moves them is either coherent or obviously not — and so a Ketcher bump, which is the one
      # here nothing in CI exercises (see the sketcher row in `ISSUES.md`), arrives on its own
      # rather than inside a dozen unrelated ones.
      ketcher:
        patterns: ['ketcher-*']
