# The checks that were being run by hand, if at all. There was no .github directory before this.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref. The full job builds, installs a browser and runs Playwright twice over, so a
# branch pushed three times in a minute otherwise queues three of them and the two older ones can
# only ever report on code nobody is looking at any more. `main` is exempt: every commit there is
# a release candidate and its result is worth having even if a newer one is already running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Both advisories this repo carried — a critical RCE in happy-dom and a high in nanoid —
      # sat in the lockfile for weeks and were found by reading `npm audit` output by hand during
      # a review. Blocking rather than advisory: an advisory check that nobody reads is the state
      # we were already in. `high` rather than `critical` because the nanoid one was a high.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      # exhaustive-deps above all: a stale closure in an effect fails intermittently, which is the
      # worst way for a bug to fail and the hardest to catch in review.
      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # Cheap, and the failure mode it catches (a token pair that reads fine and measures 2:1)
      # is invisible in review.
      - name: Contrast
        run: npm run check:contrast

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
