# The checks that were being run by hand, if at all. There was no .github directory before this.
name: CI

on:
  # Deliberately not `branches: ["**"]`. With a pull_request trigger as well, every push to a PR
  # branch would fire twice for the same commit — and the container job below builds an image, so
  # the duplication is not free. Branch coverage is unaffected in practice: work reaches main
  # through a PR.
  push:
    branches: [main]
  pull_request:
  # Re-running the gate against a ref otherwise costs an empty commit or a close-and-reopen, both
  # of which are things this repository's own review rules forbid — so without this there is no
  # legitimate way to re-run a gate at all. That is not hypothetical: a run wedged before it
  # reached the queue could be neither cancelled ("409 Cannot cancel a workflow run that has not
  # been queued yet") nor re-run, and the PR simply had no route to a verdict while every other
  # branch's CI drained normally. `Chemclaw3`'s own ci.yml added this trigger for the same reason.
  workflow_dispatch:
    inputs:
      chemclaw3_ref:
        description: >-
          The Chemclaw3 revision the contract check reads. Empty falls back to the repository
          variable CHEMCLAW3_REF, and empty again to `main`. A branch, a tag or a full SHA.
        required: false
        type: string

# A second push to a PR supersedes the first; there is no value in finishing a run for a commit
# nobody will merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Without this the workflow inherits the repository default,
# which can be write-all, while it runs `npm ci`/build/test — package-controlled code — with that
# token in the environment. This gate only reads the checkout, so read-only is all it needs; both
# sibling repos pin the same. (The trigger is `pull_request`, not `pull_request_target`, so a fork
# PR already runs without secrets — this narrows the token on same-repo runs too.)
permissions:
  contents: read

jobs:
  # One assertion step, because the gate is `scripts/ci.mjs` and this file no longer describes it.
  # Everything that used to be inline shell here — the `/config.js` reference, the MSAL entry-chunk
  # probe and its positive control, the standalone-bundle run — is a named npm script a contributor
  # can type, and `npm run ci` is the order they run in. `npm run ci -- --list` prints the list with
  # the reason for each. The steps around it are checkout, install and provisioning, which are this
  # runner's business and nobody's assertions.
  #
  # The rule this encodes: a pipeline may decide *where* a step runs. It may not decide *what* the
  # step asserts. `tests/gate.test.ts` fails if an assertion reappears in this file.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # The service this client is written against. Without it `tests/backendContract.test.ts`
      # verifies **nothing** and says so in a warning — which is what this lane did, and it is the
      # lane that runs on every push, so the one check comparing what this client sends to what
      # Chemclaw3 declares was a gate nowhere by default.
      #
      # A **full** checkout, deliberately, where `Jenkinsfile`'s `Preflight` clones sparsely. That
      # pipeline needs `deploy/jenkins/lib` for the build and derives the rest of its sparse paths
      # from the reader itself, asserted by `tests/delivery.test.ts`. Repeating that list here
      # would be a second declaration of it with nothing reconciling the two — the defect that file
      # exists to prevent — so this names no paths at all and cannot drift from the reader.
      # No credential: every repository in this family is public, so `contents: read` reaches it.
      #
      # **`ref:` is named, so pinning this lane is a setting — and pinning is opt-in.** With neither
      # the dispatch input nor `vars.CHEMCLAW3_REF` set, the expression resolves to `main`, which
      # `actions/checkout` reads as that branch's HEAD *at the moment the job runs*. So by default
      # this lane's verdict is still not a function of this repository's inputs alone: the same UI
      # commit can be green one day and red the next with nothing changed here, and re-running an
      # old pull request judges it against today's Chemclaw3. That is deliberate — a real rename
      # upstream should red loudly, which is what this check is for — but it means the default lane
      # is not repeatable, and naming `ref:` did not change that.
      #
      # What naming it buys is a remedy that is not "edit the guard": a pull request blocked by an
      # unrelated upstream change is unblocked by pointing `vars.CHEMCLAW3_REF` (or the dispatch
      # input) at the last agreeing revision — a repository setting with an audit trail — rather
      # than by weakening what is asserted. Only a full SHA there makes a run repeatable; a branch
      # or tag still moves. `Jenkinsfile` already declares `CHEMCLAW3_BRANCH` for its own clone of
      # the same repository; this is that fact in the other lane, and `tests/delivery.test.ts`
      # holds both lanes to naming one.
      - name: The Chemclaw3 checkout the contract check reads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 8fqycwdt8v-oss/Chemclaw3
          ref: ${{ inputs.chemclaw3_ref || vars.CHEMCLAW3_REF || 'main' }}
          path: .chemclaw3
          fetch-depth: 1

      - run: npm ci

      # Provisioning a browser is an agent concern, not an assertion, so it stays in the pipeline:
      # the e2e step inside the gate runs `playwright test` and expects one to be here already.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: The gate
        env:
          CHEMCLAW3_DIR: ${{ github.workspace }}/.chemclaw3
          # REQUIRED rather than best-effort. A check that degrades to a warning the moment the
          # checkout moves is a control this lane would claim and not have, which is the state
          # this step replaces. What it costs is real and was the recorded reason for not doing
          # it: this lane now reds on a rename merged in another repository, including on a pull
          # request that has nothing to do with the contract.
          CHEMCLAW3_REQUIRED: '1'
        run: npm run ci

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  container:
    # The other half of the gate definition, on its own runner for the parallelism and for buildx's
    # layer cache. The image is built here — how an image is built legitimately differs per pipeline
    # — and then `npm run ci:container` asserts what it serves, which does not differ: those four
    # assertions are `scripts/check-serving.mjs`, the same file the Jenkins pipeline runs against
    # the image it is about to publish.
    #
    # CI_REQUIRE_CONTAINER=1 because absent Docker is a skip locally and a broken agent here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: chemclaw3-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The container serves the SPA, its runtime config, and nothing it should not
        env:
          CI_REQUIRE_CONTAINER: '1'
          SKIP_IMAGE_BUILD: '1'
          # buildx loaded the image into the Docker daemon's store, so Docker is the runtime that
          # holds it. Without this the script autodetects, finds podman (which ubuntu-latest also
          # ships), looks in an empty store and tries to pull `chemclaw3-ui:ci` from a registry.
          CONTAINER_RUNTIME: docker
        run: npm run ci:container
