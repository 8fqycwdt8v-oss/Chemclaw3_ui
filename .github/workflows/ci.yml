# The checks that were being run by hand, if at all. There was no .github directory before this.
name: CI

on:
  # Deliberately not `branches: ["**"]`. With a pull_request trigger as well, every push to a PR
  # branch would fire twice for the same commit — and the container job below builds an image, so
  # the duplication is not free. Branch coverage is unaffected in practice: work reaches main
  # through a PR.
  push:
    branches: [main]
  pull_request:
  # Re-running the gate against a ref otherwise costs an empty commit or a close-and-reopen, both
  # of which are things this repository's own review rules forbid — so without this there is no
  # legitimate way to re-run a gate at all. That is not hypothetical: a run wedged before it
  # reached the queue could be neither cancelled ("409 Cannot cancel a workflow run that has not
  # been queued yet") nor re-run, and the PR simply had no route to a verdict while every other
  # branch's CI drained normally. `Chemclaw3`'s own ci.yml added this trigger for the same reason.
  workflow_dispatch:

# A second push to a PR supersedes the first; there is no value in finishing a run for a commit
# nobody will merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Without this the workflow inherits the repository default,
# which can be write-all, while it runs `npm ci`/build/test — package-controlled code — with that
# token in the environment. This gate only reads the checkout, so read-only is all it needs; both
# sibling repos pin the same. (The trigger is `pull_request`, not `pull_request_target`, so a fork
# PR already runs without secrets — this narrows the token on same-repo runs too.)
permissions:
  contents: read

jobs:
  # One assertion step, because the gate is `scripts/ci.mjs` and this file no longer describes it.
  # Everything that used to be inline shell here — the `/config.js` reference, the MSAL entry-chunk
  # probe and its positive control, the standalone-bundle run — is a named npm script a contributor
  # can type, and `npm run ci` is the order they run in. `npm run ci -- --list` prints the list with
  # the reason for each. The steps around it are checkout, install and provisioning, which are this
  # runner's business and nobody's assertions.
  #
  # The rule this encodes: a pipeline may decide *where* a step runs. It may not decide *what* the
  # step asserts. `tests/gate.test.ts` fails if an assertion reappears in this file.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # The commit of core this repository's API contract is pinned to (`contracts/core.lock`),
      # printed in a step of its own so the sha in the log is the sha the checkout reads. There is
      # no variable or dispatch input that names another: bumping the pin is a commit
      # (`docs/api-contract.md`), so this lane's verdict is a function of this repository's inputs
      # alone. A force-pushed or deleted pin fails the checkout below, loudly.
      - name: Which Chemclaw3 commit the API contract is pinned to
        id: contract_pin
        run: node scripts/contract-check.mjs --pinned-sha

      # `npm run contract:check` compares the committed copy with core's file at that commit, so
      # the checkout is that one commit, shallow: the check reads a single blob out of it. No
      # credential: every repository in this family is public.
      - name: The Chemclaw3 checkout the contract check reads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 8fqycwdt8v-oss/Chemclaw3
          ref: ${{ steps.contract_pin.outputs.sha }}
          path: .chemclaw3
          fetch-depth: 1
          persist-credentials: false

      - run: npm ci

      # Provisioning a browser is an agent concern, not an assertion, so it stays in the pipeline:
      # the e2e step inside the gate runs `playwright test` and expects one to be here already.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: The gate
        env:
          CHEMCLAW3_DIR: ${{ github.workspace }}/.chemclaw3
          # REQUIRED rather than best-effort: a contract check that degrades to a warning when the
          # checkout is missing or the pinned commit is unreachable is a control this lane would
          # claim and not have.
          CHEMCLAW3_REQUIRED: '1'
        run: npm run ci

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  container:
    # The other half of the gate definition, on its own runner for the parallelism and for buildx's
    # layer cache. The image is built here — how an image is built legitimately differs per pipeline
    # — and then `npm run ci:container` asserts what it serves, which does not differ: those four
    # assertions are `scripts/check-serving.mjs`, the same file the Jenkins pipeline runs against
    # the image it is about to publish.
    #
    # CI_REQUIRE_CONTAINER=1 because absent Docker is a skip locally and a broken agent here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: chemclaw3-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The container serves the SPA, its runtime config, and nothing it should not
        env:
          CI_REQUIRE_CONTAINER: '1'
          SKIP_IMAGE_BUILD: '1'
          # buildx loaded the image into the Docker daemon's store, so Docker is the runtime that
          # holds it. Without this the script autodetects, finds podman (which ubuntu-latest also
          # ships), looks in an empty store and tries to pull `chemclaw3-ui:ci` from a registry.
          CONTAINER_RUNTIME: docker
        run: npm run ci:container

  oidc-mock:
    # The real browser sign-in, against Chemclaw3_mock's stand-in Entra tenant
    # (`e2e/oidc-mock.spec.ts`; `playwright.oidc-mock.config.ts` has the four processes). Every
    # other browser test runs `AUTH_MODE=dev`, so before this job nothing on a pull request drove
    # MSAL at all — and #126 merged green while every first sign-in looped for ever between `/`
    # and `/c/<id>` with the code never redeemed: 534 navigations and no token request in the
    # spec's own count. This lane failed on that commit; it is here so the next one cannot merge.
    #
    # Its own job rather than a step of `check`: it needs Python and a second repository, it builds
    # the production bundle the gate does not, and in parallel it costs the pull request no wall
    # time the gate was not already spending.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The tenant, **pinned to a commit**, so this lane's verdict is a function of this
      # repository's inputs: the mock serves the login page and mints the tokens this job trusts,
      # and a moving `main` would let a change there red (or green) a pull request here with
      # nothing changed in it. To bump: point `ref:` at a newer Chemclaw3_mock commit SHA
      # (`gh api repos/8fqycwdt8v-oss/Chemclaw3_mock/commits/main --jq .sha`) in a pull request of
      # its own, whose run of this job is the proof the new tenant still signs in. No credential:
      # the repository is public.
      - name: The Chemclaw3_mock checkout the tenant runs from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 8fqycwdt8v-oss/Chemclaw3_mock
          ref: 74d495f6e544238fa6f32d554d1e071d0c74dd08 # main at #14, 2026-10
          path: .chemclaw3-mock
          fetch-depth: 1
          persist-credentials: false

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # `pip install -e .` into the checkout's `.venv`, per the mock's README — the path its own
      # `start.sh` and this lane's config both run it from.
      - name: The mock tenant's Python environment
        env:
          MOCK_DIR: ${{ github.workspace }}/.chemclaw3-mock
        run: npm run provision:mock-tenant

      # The production bundle (`dist/client`), which is what the lane signs in through.
      - run: npm run build

      - name: Sign in through a real authority, in a real browser
        env:
          MOCK_DIR: ${{ github.workspace }}/.chemclaw3-mock
        run: npm run test:e2e:oidc-mock

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-mock-traces
          path: test-results/
          retention-days: 7
