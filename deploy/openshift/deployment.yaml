# The BFF + SPA, with the HTML sandbox's second listener — an EXAMPLE, not a chart.
#
# This repository ships no chart (README, "Delivery"): Jenkins re-points this Deployment with
# `oc set image deployment/chemclaw3-ui ui=<registry>/<image>@sha256:…`, so the Deployment and
# container names below are the ones `Jenkinsfile` names. Copy, change the hosts and the tenant,
# apply once; every later release is that one `oc set image`.
#
# Two container ports, because the sandbox is a different ORIGIN, and a port is the smallest unit
# of one this process can offer: `http` (PORT) serves the app and never `/sandbox/frame`;
# `sandbox` (SANDBOX_PORT) serves `GET /sandbox/frame` and nothing else. Each gets its own Route on
# its own host (routes.yaml). `tests/openshiftManifests.test.ts` parses these files and holds every
# env name, port and origin here to `server/config.ts` and to the Routes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chemclaw3-ui
  labels:
    app.kubernetes.io/name: chemclaw3-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chemclaw3-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chemclaw3-ui
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # SIGTERM fails /readyz for SHUTDOWN_DRAIN_MS (10 s) and then waits 5 s for open streams, so
      # the whole drain must fit under this.
      terminationGracePeriodSeconds: 30
      securityContext:
        # No runAsUser: the restricted SCC assigns the namespace's UID range.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          # Replaced on every release by Jenkins, by digest — a tag is a pointer.
          image: image-registry.openshift-image-registry.svc:5000/chemclaw/chemclaw3-ui:replace-me
          env:
            - name: PORT
              value: '8080'
            - name: BIND_HOST
              value: 0.0.0.0
            # The service ROOT, never a path under it (refused at boot).
            - name: CHEMCLAW_API_URL
              value: http://chemclaw-service:8080
            - name: AUTH_MODE
              value: msal
            - name: ENTRA_TENANT_ID
              value: 00000000-0000-0000-0000-000000000000
            - name: ENTRA_CLIENT_ID
              value: 11111111-1111-1111-1111-111111111111
            - name: API_SCOPE
              value: api://22222222-2222-2222-2222-222222222222/Chat.Access
            - name: REVIEWER_ROLES
              value: knowledge-reviewer,process-chemist
            # Exactly what the browser types, scheme and host — the Routes' hosts, over https. The
            # shell takes content only from APP_ORIGIN, so a chemist reaching the app at any other
            # address sees the HTML artefact as source with both origins named.
            - name: APP_ORIGIN
              value: https://chemclaw.apps.example.com
            # Prefer a separate registrable domain (not a subdomain of the app's), so the two are
            # different SITES as well as different origins: nothing the app's domain sets — a
            # cookie, a storage partition — reaches the sandbox.
            - name: SANDBOX_ORIGIN
              value: https://chemclaw-sandbox.example-usercontent.net
            - name: SANDBOX_PORT
              value: '8081'
            - name: SANDBOX_BIND_HOST
              value: 0.0.0.0
            # On by the owner's decision of 2026-10-03; `off` is the kill switch that puts back
            # "Run scripts" (README, "HTML sandbox").
            - name: HTML_SCRIPTS_DEFAULT
              value: 'on'
          ports:
            - name: http
              containerPort: 8080
            - name: sandbox
              containerPort: 8081
          # Both on the APP port. /readyz asks the service's own /readyz and fails while draining;
          # /healthz is liveness and consults nothing upstream.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          # The sandbox listener has no health route — it serves one page — so that page is its
          # probe. A second listener that cannot bind exits the process anyway (server/index.ts);
          # this catches the other way to lose it: a configuration that turned the sandbox OFF
          # (SANDBOX_ORIGIN unset, ALLOW_FRAMING=true — the startup line says which) under a
          # Route that still points here. Remove it only if you mean to run without the sandbox.
          startupProbe:
            httpGet:
              path: /sandbox/frame
              port: sandbox
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
