# Two Routes, two hosts: the app, and the HTML sandbox on a host of its own.
#
# Both edge-terminated with http redirected to https — an https app cannot frame an http sandbox
# (the BFF refuses that pair at boot as mixed content). The hosts here are the hosts in
# APP_ORIGIN / SANDBOX_ORIGIN (deployment.yaml), exactly; `tests/openshiftManifests.test.ts`
# holds the two together.
#
# What must NOT stand in front of the sandbox host (README, "HTML sandbox"):
#   - no oauth-proxy or SSO: the frame is loaded by the browser with no credential, and a login
#     redirect inside it is a blank box at best and a sign-in page on the wrong origin at worst;
#   - no proxy that rewrites security headers: the sandbox page's own Content-Security-Policy must
#     arrive intact, and nothing may add X-Frame-Options or the APP's CSP to it, or the frame is
#     refused (its frame-ancestors names APP_ORIGIN; the app's says 'none').
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: chemclaw3-ui
  labels:
    app.kubernetes.io/name: chemclaw3-ui
  annotations:
    # Sessions live in one pod's memory, so the router must keep a browser on the pod that signed
    # it in. The router's affinity cookie does exactly that and is on by default; this says so on
    # purpose. `disable_cookies: 'true'` here would sign people out on every other request.
    haproxy.router.openshift.io/disable_cookies: 'false'
    # A per-client-IP limit is a REQUIRED control here, not an option: `/auth/login` and
    # `/auth/callback` are open to anyone, and each callback can cost one call to the identity
    # provider carrying the client secret. The BFF bounds how many run at once (OIDC_MAX_INFLIGHT)
    # but cannot see the real client address safely, so the router counts per source IP. Numbers
    # are per 3 seconds; raise them for an office whose users share one address.
    haproxy.router.openshift.io/rate-limit-connections: 'true'
    haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: '200'
    haproxy.router.openshift.io/rate-limit-connections.rate-tcp: '100'
    haproxy.router.openshift.io/rate-limit-connections.rate-http: '300'
spec:
  host: chemclaw.apps.example.com
  to:
    kind: Service
    name: chemclaw3-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: chemclaw3-ui-sandbox
  labels:
    app.kubernetes.io/name: chemclaw3-ui
  annotations:
    # The router's sticky-session cookie would be the one cookie ever set on the sandbox origin.
    # The shell is stateless and the same on every pod; it needs no affinity.
    haproxy.router.openshift.io/disable_cookies: 'true'
spec:
  host: chemclaw-sandbox.example-usercontent.net
  to:
    kind: Service
    name: chemclaw3-ui
  port:
    targetPort: sandbox
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
