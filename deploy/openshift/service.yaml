# One Service, three named ports — `http` for the app Route, `sandbox` for the sandbox Route, and
# `metrics` for an in-cluster scraper (a ServiceMonitor names it; docs/operations.md §6), which no
# Route may target. The Routes target ports by NAME (routes.yaml), so renumbering is a change here.
apiVersion: v1
kind: Service
metadata:
  name: chemclaw3-ui
  labels:
    app.kubernetes.io/name: chemclaw3-ui
spec:
  selector:
    app.kubernetes.io/name: chemclaw3-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: sandbox
      port: 8081
      targetPort: sandbox
    - name: metrics
      port: 8082
      targetPort: metrics
