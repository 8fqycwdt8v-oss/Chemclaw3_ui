<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to anything but 0, which
         the composer needs so it does not sit under an iPhone's home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chemclaw — process &amp; analytical development assistant</title>

    <!--
      Resolve the theme before the stylesheet, so the first paint is already correct.
      A file rather than an inline script: `script-src 'self'` carries no nonce and no hashes
      (server/config.ts), so an inline block would be refused and every load would flash.
    -->
    <script src="/theme-boot.js"></script>

    <!--
      Runtime configuration, served by the BFF from its own environment (server/runtimeConfig.ts).
      A separate same-origin file rather than an inline script, so `script-src 'self'` covers it
      with no CSP nonce. It MUST load before the module script — src/env.ts reads it at import
      time so that one image can serve any tenant without a rebuild.
    -->
    <script src="/config.js"></script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Chemclaw — a process and analytical development assistant for pharmaceutical and chemical R&amp;D."
    />

    <!--
      The one font face the first paint certainly needs.

      Body text is `--font-sans` (src/index.css), which is 'Inter Variable' — so its latin subset
      is on the critical path of every page. Without this it is discovered three hops in: fetch
      index.html, fetch the stylesheet, parse it, match a unicode-range, then fetch the font. This
      starts it with the HTML instead, and `font-display: swap` means the difference is how long a
      chemist reads the fallback typeface rather than whether they read anything.

      The href is checked, not assumed: Vite rewrites `<link href>` in this file through the same
      asset pipeline the `@fontsource-variable` CSS import goes through and DEDUPES it, so this
      emits no second copy and resolves to the byte-identical hashed path the stylesheet's
      `@font-face` names (verified in `npm run build:client`; `tests/fontLoading.test.ts` holds
      it). Writing the hashed name here by hand would be the mistake — the hash is content-derived
      and changes with the package.

      Only this face. 'JetBrains Mono Variable' is the other candidate and is deliberately not
      preloaded: nothing in the shell, the sidebar or the composer is monospaced, so it is needed
      only once a transcript with a code span or a SMILES renders — conditional on what the reader
      restored — and a preload the browser does not use inside a few seconds is 40 kB of
      critical-path bandwidth plus a console warning saying so.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
    />

    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
  </body>
</html>
